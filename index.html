<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#10131b">
<title>Ika Music — Temporary Maintenance</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(ellipse at 50% 0%,#252b3b 0%,#151923 48%,#0c0f15 100%);color:#f5f6fa;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(100%,680px);text-align:center;padding:54px 34px}
.mark{width:66px;height:66px;margin:0 auto 28px;display:grid;place-items:center;border:1px solid #59647c;border-radius:20px;background:#20283a;color:#d9e2ff}
.mark svg{width:30px;height:30px}.eyebrow{color:#aebbd6;font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
h1{margin:14px 0 18px;font-size:clamp(36px,7vw,58px);line-height:1.04;letter-spacing:-.045em}
p{margin:0 auto;max-width:510px;color:#c2c8d5;font-size:17px;line-height:1.7}
.rule{width:54px;height:3px;margin:32px auto;border-radius:4px;background:#91a9df}
.note{color:#929bad;font-size:13px}footer{margin-top:48px;color:#687286;font-size:12px;letter-spacing:.08em}
</style>
</head>
<body>
<main>
<div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
<div class="eyebrow">Ika Music</div>
<h1>We’ll be back soon.</h1>
<p>Ika Music is temporarily offline while we complete platform maintenance and improve the security of our music library.</p>
<div class="rule"></div>
<p class="note">Thank you for your patience. Please check back soon.</p>
<footer>IKA MUSIC · TEMPORARY MAINTENANCE</footer>
</main>
</body>
</html>
